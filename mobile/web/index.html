<!DOCTYPE html>
<html lang="en" style="color-scheme: light;">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light only" />
    <title>Purrfect Care</title>
    <meta name="description" content="Purrfect Care — vet appointments, AI health companion, and a cat store, all in one app." />
    <meta name="theme-color" content="#F5EBE6" />

    <!-- Force light mode — must be first, before any other styles -->
    <style>
      /* Lock colour scheme before ANY JS runs */
      :root, html {
        color-scheme: light only !important;
        background-color: #F5EBE6 !important;
        color: #2D1B0E !important;
      }
      body {
        background-color: #F5EBE6 !important;
        color: #2D1B0E !important;
      }
      /* React Native Web sets these on the root div */
      #root, #root > div {
        background-color: #F5EBE6 !important;
      }
      /* Kill every dark-mode override from RNW or the browser */
      @media (prefers-color-scheme: dark) {
        :root, html, body, #root {
          color-scheme: light only !important;
          background-color: #F5EBE6 !important;
          color: #2D1B0E !important;
        }
        /* RNW injects inline background styles on Views — defeat them */
        div[style*="background-color: rgb(0, 0, 0)"],
        div[style*="background-color:rgb(0,0,0)"],
        div[style*="background-color: black"] {
          background-color: #F5EBE6 !important;
        }
      }
    </style>

    <!-- The react-native-web recommended style reset -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }

      /* Override RNW dark-mode defaults */
      div[data-focusable], [role="button"] { -webkit-tap-highlight-color: transparent; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #EDE2D9; }
      ::-webkit-scrollbar-thumb { background: #7A6055; border-radius: 99px; }

      /* Prevent RNW from picking up OS dark theme */
      * { color-scheme: light only !important; }
    </style>

    <link rel="icon" href="/favicon.ico" />
  </head>
  <body style="background-color: #F5EBE6;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    %%EXPO_HEAD%%
  </body>
</html>

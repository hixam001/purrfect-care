openapi: "3.1.0"

info:
  title: Purrfect Care API
  description: |
    All-in-one cat care platform — veterinary appointments, real-time vet chat,
    AI health companion, cat store, medicine database, and more.
  version: "1.0.0"
  contact:
    name: Purrfect Care Team
    email: dev@purrfectcare.com

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.purrfectcare.com
    description: Production

tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Cats
  - name: Breeds
  - name: Hospitals
  - name: Vets
  - name: Appointments
  - name: Chat
  - name: Medicines
  - name: Prescriptions
  - name: Stores
  - name: Orders
  - name: Reviews
  - name: Offers
  - name: Notifications
  - name: Admin

# ─────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT — obtain from POST /api/auth/login

  # ─── Shared Responses ───────────────────────
  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: true
            error_code: UNAUTHORIZED
            message: Authentication required

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: true
            error_code: FORBIDDEN
            message: You do not have permission to perform this action

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: true
            error_code: NOT_FOUND
            message: Resource not found

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorResponse" }

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error: true
            error_code: INTERNAL_ERROR
            message: An unexpected error occurred

  # ─── Schemas ────────────────────────────────
  schemas:

    # Error shapes
    ErrorResponse:
      type: object
      required: [error, error_code, message]
      properties:
        error:      { type: boolean, example: true }
        error_code: { type: string,  example: NOT_FOUND }
        message:    { type: string,  example: Resource not found }
        details:    { type: object }

    ValidationErrorResponse:
      type: object
      properties:
        error:      { type: boolean, example: true }
        error_code: { type: string,  example: VALIDATION_ERROR }
        message:    { type: string,  example: Request validation failed }
        details:
          type: array
          items:
            type: object
            properties:
              field:   { type: string }
              message: { type: string }
              type:    { type: string }

    PaginatedMeta:
      type: object
      properties:
        page:        { type: integer }
        limit:       { type: integer }
        total:       { type: integer }
        total_pages: { type: integer }

    # Enums
    UserRole:
      type: string
      enum: [cat_owner, vet, hospital_admin, store_owner, admin]

    AppointmentStatus:
      type: string
      enum: [pending, confirmed, in_progress, completed, cancelled, no_show]

    OrderStatus:
      type: string
      enum: [pending, confirmed, preparing, ready, out_for_delivery, delivered, cancelled, refunded]

    PaymentStatus:
      type: string
      enum: [pending, completed, failed, refunded]

    PrescriptionStatus:
      type: string
      enum: [active, completed, cancelled]

    MessageType:
      type: string
      enum: [text, image, file, prescription_share]

    # User
    UserResponse:
      type: object
      properties:
        id:         { type: string, format: uuid }
        email:      { type: string, format: email }
        name:       { type: string }
        phone:      { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        address:    { type: string, nullable: true }
        city:       { type: string, nullable: true }
        country:    { type: string, nullable: true }
        role:       { $ref: "#/components/schemas/UserRole" }
        is_active:  { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    LoginResponse:
      type: object
      properties:
        user:          { $ref: "#/components/schemas/UserResponse" }
        access_token:  { type: string }
        refresh_token: { type: string, nullable: true }
        token_type:    { type: string, example: bearer }

    # Cat Breed
    CatBreedResponse:
      type: object
      properties:
        id:                  { type: string, format: uuid }
        name:                { type: string }
        origin_country:      { type: string, nullable: true }
        size_category:       { type: string, nullable: true }
        coat_type:           { type: string, nullable: true }
        temperament:         { type: string, nullable: true }
        description:         { type: string, nullable: true }
        avg_lifespan_years:  { type: number, nullable: true }
        avg_weight_kg:       { type: number, nullable: true }
        common_health_issues:
          type: array
          items: { type: string }
        grooming_needs:
          type: array
          items: { type: string }
        image_url: { type: string, nullable: true }

    # Cat
    CatResponse:
      type: object
      properties:
        id:           { type: string, format: uuid }
        owner_id:     { type: string, format: uuid }
        name:         { type: string }
        breed_id:     { type: string, format: uuid, nullable: true }
        age_months:   { type: integer, nullable: true }
        weight_kg:    { type: number, nullable: true }
        color:        { type: string, nullable: true }
        gender:       { type: string, enum: [male, female], nullable: true }
        photo_url:    { type: string, nullable: true }
        is_neutered:  { type: boolean }
        microchip_id: { type: string, nullable: true }
        registered_at: { type: string, format: date-time }
        breed:        { $ref: "#/components/schemas/CatBreedResponse", nullable: true }
        medical_record: { $ref: "#/components/schemas/MedicalRecordResponse", nullable: true }

    MedicalRecordResponse:
      type: object
      properties:
        id:                  { type: string, format: uuid }
        cat_id:              { type: string, format: uuid }
        allergies:           { type: array, items: { type: string } }
        existing_conditions: { type: array, items: { type: string } }
        vaccination_status:  { type: object }
        blood_type:          { type: string, nullable: true }
        notes:               { type: string, nullable: true }
        last_updated:        { type: string, format: date-time, nullable: true }

    # Hospital
    HospitalResponse:
      type: object
      properties:
        id:              { type: string, format: uuid }
        admin_user_id:   { type: string, format: uuid }
        name:            { type: string }
        description:     { type: string, nullable: true }
        phone:           { type: string, nullable: true }
        email:           { type: string, nullable: true }
        address:         { type: string }
        city:            { type: string, nullable: true }
        banner_url:      { type: string, nullable: true }
        operating_hours: { type: object, nullable: true }
        latitude:        { type: number }
        longitude:       { type: number }
        is_active:       { type: boolean }
        is_approved:     { type: boolean }
        rating:          { type: number }
        total_reviews:   { type: integer }
        page_config:     { type: object }
        created_at:      { type: string, format: date-time }
        distance_km:     { type: number, nullable: true }

    HospitalServiceResponse:
      type: object
      properties:
        id:               { type: string, format: uuid }
        hospital_id:      { type: string, format: uuid }
        name:             { type: string }
        description:      { type: string, nullable: true }
        category:         { type: string, nullable: true }
        price:            { type: number }
        duration_minutes: { type: integer }
        is_active:        { type: boolean }

    SlotResponse:
      type: object
      properties:
        id:          { type: string, format: uuid }
        hospital_id: { type: string, format: uuid }
        vet_id:      { type: string, format: uuid }
        slot_date:   { type: string, format: date }
        start_time:  { type: string, format: time }
        end_time:    { type: string, format: time }
        is_booked:   { type: boolean }
        is_recurring:{ type: boolean }

    # Vet
    VetResponse:
      type: object
      properties:
        id:               { type: string, format: uuid }
        user_id:          { type: string, format: uuid }
        hospital_id:      { type: string, format: uuid, nullable: true }
        license_number:   { type: string }
        specialization:   { type: string, nullable: true }
        experience_years: { type: integer, nullable: true }
        bio:              { type: string, nullable: true }
        qualifications:   { type: array, items: { type: string } }
        is_verified:      { type: boolean }
        rating:           { type: number }
        total_reviews:    { type: integer }
        verified_at:      { type: string, format: date-time, nullable: true }
        user_name:        { type: string, nullable: true }
        user_email:       { type: string, nullable: true }
        hospital_name:    { type: string, nullable: true }

    # Appointment
    AppointmentResponse:
      type: object
      properties:
        id:               { type: string, format: uuid }
        user_id:          { type: string, format: uuid }
        cat_id:           { type: string, format: uuid }
        vet_id:           { type: string, format: uuid }
        hospital_id:      { type: string, format: uuid }
        service_id:       { type: string, format: uuid }
        slot_id:          { type: string, format: uuid }
        appointment_date: { type: string, format: date-time }
        status:           { $ref: "#/components/schemas/AppointmentStatus" }
        notes:            { type: string, nullable: true }
        amount_paid:      { type: number, nullable: true }
        payment_id:       { type: string, nullable: true }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time, nullable: true }
        hospital_name:    { type: string, nullable: true }
        vet_name:         { type: string, nullable: true }
        service_name:     { type: string, nullable: true }
        cat_name:         { type: string, nullable: true }

    # Chat
    ChatRoomResponse:
      type: object
      properties:
        id:             { type: string, format: uuid }
        user_id:        { type: string, format: uuid }
        vet_id:         { type: string, format: uuid }
        last_message_at:{ type: string, format: date-time, nullable: true }
        unread_user:    { type: integer }
        unread_vet:     { type: integer }
        is_active:      { type: boolean }
        created_at:     { type: string, format: date-time }
        vet_name:       { type: string, nullable: true }
        user_name:      { type: string, nullable: true }
        last_message:   { type: string, nullable: true }

    MessageResponse:
      type: object
      properties:
        id:           { type: string, format: uuid }
        chat_room_id: { type: string, format: uuid }
        sender_id:    { type: string, format: uuid }
        content:      { type: string }
        message_type: { $ref: "#/components/schemas/MessageType" }
        media_url:    { type: string, nullable: true }
        is_read:      { type: boolean }
        sent_at:      { type: string, format: date-time }
        sender_name:  { type: string, nullable: true }

    # Medicine
    MedicineResponse:
      type: object
      properties:
        id:                    { type: string, format: uuid }
        name:                  { type: string }
        generic_name:          { type: string, nullable: true }
        manufacturer:          { type: string, nullable: true }
        ingredients:           { type: array, items: { type: string } }
        dosage_form:           { type: string, nullable: true }
        description:           { type: string, nullable: true }
        usage_instructions:    { type: string, nullable: true }
        contraindications:     { type: array, items: { type: string } }
        allergy_warnings:      { type: array, items: { type: string } }
        breed_warnings:        { type: array, items: { type: string } }
        side_effects:          { type: array, items: { type: string } }
        requires_prescription: { type: boolean }
        is_active:             { type: boolean }
        created_at:            { type: string, format: date-time, nullable: true }

    # Prescription
    PrescriptionResponse:
      type: object
      properties:
        id:             { type: string, format: uuid }
        appointment_id: { type: string, format: uuid, nullable: true }
        cat_id:         { type: string, format: uuid }
        vet_id:         { type: string, format: uuid }
        medicine_id:    { type: string, format: uuid }
        dosage:         { type: string }
        frequency:      { type: string }
        duration_days:  { type: integer }
        instructions:   { type: string, nullable: true }
        status:         { $ref: "#/components/schemas/PrescriptionStatus" }
        prescribed_at:  { type: string, format: date-time }
        medicine_name:  { type: string, nullable: true }
        cat_name:       { type: string, nullable: true }
        vet_name:       { type: string, nullable: true }

    # Store & Product
    StoreResponse:
      type: object
      properties:
        id:              { type: string, format: uuid }
        owner_user_id:   { type: string, format: uuid }
        name:            { type: string }
        description:     { type: string, nullable: true }
        phone:           { type: string, nullable: true }
        email:           { type: string, nullable: true }
        address:         { type: string }
        city:            { type: string, nullable: true }
        banner_url:      { type: string, nullable: true }
        operating_hours: { type: object, nullable: true }
        delivery_zones:  { type: object, nullable: true }
        delivery_fee:    { type: number }
        latitude:        { type: number }
        longitude:       { type: number }
        is_active:       { type: boolean }
        is_approved:     { type: boolean }
        rating:          { type: number }
        total_reviews:   { type: integer }
        page_config:     { type: object }
        created_at:      { type: string, format: date-time }
        distance_km:     { type: number, nullable: true }

    ProductResponse:
      type: object
      properties:
        id:             { type: string, format: uuid }
        store_id:       { type: string, format: uuid }
        category_id:    { type: string, format: uuid, nullable: true }
        name:           { type: string }
        description:    { type: string, nullable: true }
        price:          { type: number }
        discount_price: { type: number, nullable: true }
        images:         { type: array, items: { type: string } }
        stock_quantity: { type: integer }
        brand:          { type: string, nullable: true }
        weight:         { type: number, nullable: true }
        unit:           { type: string, nullable: true }
        is_active:      { type: boolean }
        rating:         { type: number }
        total_reviews:  { type: integer }
        created_at:     { type: string, format: date-time }
        category_name:  { type: string, nullable: true }

    # Order
    OrderResponse:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        user_id:            { type: string, format: uuid }
        store_id:           { type: string, format: uuid }
        subtotal:           { type: number }
        delivery_fee:       { type: number }
        total:              { type: number }
        status:             { $ref: "#/components/schemas/OrderStatus" }
        payment_id:         { type: string, format: uuid, nullable: true }
        delivery_address:   { type: string }
        notes:              { type: string, nullable: true }
        ordered_at:         { type: string, format: date-time }
        delivered_at:       { type: string, format: date-time, nullable: true }
        store_name:         { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              id:            { type: string, format: uuid }
              product_id:    { type: string, format: uuid }
              quantity:      { type: integer }
              unit_price:    { type: number }
              total_price:   { type: number }
              product_name:  { type: string, nullable: true }
              product_image: { type: string, nullable: true }

    # Review
    ReviewResponse:
      type: object
      properties:
        id:          { type: string, format: uuid }
        user_id:     { type: string, format: uuid }
        hospital_id: { type: string, format: uuid, nullable: true }
        store_id:    { type: string, format: uuid, nullable: true }
        vet_id:      { type: string, format: uuid, nullable: true }
        rating:      { type: integer, minimum: 1, maximum: 5 }
        comment:     { type: string, nullable: true }
        status:      { type: string, example: published }
        created_at:  { type: string, format: date-time }
        user_name:   { type: string, nullable: true }
        user_avatar: { type: string, nullable: true }

    # Offer
    OfferResponse:
      type: object
      properties:
        id:               { type: string, format: uuid }
        hospital_id:      { type: string, format: uuid, nullable: true }
        store_id:         { type: string, format: uuid, nullable: true }
        title:            { type: string }
        description:      { type: string, nullable: true }
        discount_percent: { type: number, nullable: true }
        promo_code:       { type: string, nullable: true }
        valid_from:       { type: string, format: date-time }
        valid_to:         { type: string, format: date-time }
        is_active:        { type: boolean }
        applicable_items: { type: array, items: { type: string } }

    # Notification
    NotificationResponse:
      type: object
      properties:
        id:         { type: string, format: uuid }
        user_id:    { type: string, format: uuid }
        type:       { type: string }
        title:      { type: string }
        body:       { type: string, nullable: true }
        channel:    { type: string, enum: [push, email, sms] }
        data:       { type: object }
        is_read:    { type: boolean }
        created_at: { type: string, format: date-time }

# ─────────────────────────────────────────────
# Global security (override per-route if needed)
# ─────────────────────────────────────────────
security:
  - BearerAuth: []

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── System ──────────────────────────────────
  /api/health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              example:
                status: healthy
                service: Purrfect Care API
                version: "1.0.0"
                environment: development

  # ── Auth ────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:      { type: string }
                email:     { type: string, format: email }
                password:  { type: string, minLength: 8 }
                role:      { $ref: "#/components/schemas/UserRole" }
                phone:     { type: string }
                city:      { type: string }
                country:   { type: string }
                latitude:  { type: number }
                longitude: { type: number }
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate token)
      responses:
        "200":
          description: Logged out
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }

  /api/auth/password-reset:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Reset email sent (if account exists)

  # ── Users ───────────────────────────────────
  /api/users/me:
    put:
      tags: [Users]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:      { type: string }
                phone:     { type: string }
                avatar_url:{ type: string }
                address:   { type: string }
                city:      { type: string }
                country:   { type: string }
                latitude:  { type: number }
                longitude: { type: number }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Cats ────────────────────────────────────
  /api/cats:
    get:
      tags: [Cats]
      summary: List my cats
      responses:
        "200":
          description: List of cats
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatResponse" }
    post:
      tags: [Cats]
      summary: Register a cat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:                { type: string }
                breed_id:            { type: string, format: uuid }
                age_months:          { type: integer }
                weight_kg:           { type: number }
                color:               { type: string }
                gender:              { type: string, enum: [male, female] }
                is_neutered:         { type: boolean }
                microchip_id:        { type: string }
                allergies:           { type: array, items: { type: string } }
                existing_conditions: { type: array, items: { type: string } }
                blood_type:          { type: string }
      responses:
        "201":
          description: Cat registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cats/{cat_id}:
    parameters:
      - name: cat_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Cats]
      summary: Get cat by ID
      responses:
        "200":
          description: Cat details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Cats]
      summary: Update cat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:       { type: string }
                age_months: { type: integer }
                weight_kg:  { type: number }
                photo_url:  { type: string }
                is_neutered:{ type: boolean }
      responses:
        "200":
          description: Updated cat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatResponse" }
    delete:
      tags: [Cats]
      summary: Delete cat
      responses:
        "204":
          description: Deleted

  /api/breeds:
    get:
      tags: [Breeds]
      summary: List all cat breeds
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of breeds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatBreedResponse" }

  # ── Hospitals ───────────────────────────────
  /api/hospitals:
    get:
      tags: [Hospitals]
      summary: List hospitals (with optional proximity filter)
      security: []
      parameters:
        - name: city      
          in: query
          schema: { type: string }
        - name: lat       
          in: query
          schema: { type: number }
        - name: lng       
          in: query
          schema: { type: number }
        - name: radius_km 
          in: query
          schema: { type: number }
        - name: page      
          in: query
          schema: { type: integer, default: 1 }
        - name: limit     
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: List of hospitals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HospitalResponse" }
    post:
      tags: [Hospitals]
      summary: Register a hospital (hospital_admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, latitude, longitude]
              properties:
                name:            { type: string }
                description:     { type: string }
                phone:           { type: string }
                email:           { type: string }
                address:         { type: string }
                city:            { type: string }
                latitude:        { type: number }
                longitude:       { type: number }
                operating_hours: { type: object }
      responses:
        "201":
          description: Hospital registered (pending approval)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HospitalResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/hospitals/{hospital_id}:
    parameters:
      - name: hospital_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Hospitals]
      summary: Get hospital details
      security: []
      responses:
        "200":
          description: Hospital details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HospitalResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Hospitals]
      summary: Update hospital
      responses:
        "200":
          description: Updated hospital
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HospitalResponse" }

  /api/hospitals/{hospital_id}/services:
    parameters:
      - name: hospital_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Hospitals]
      summary: Get hospital services
      security: []
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HospitalServiceResponse" }
    post:
      tags: [Hospitals]
      summary: Add a service to hospital
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name:             { type: string }
                description:      { type: string }
                category:         { type: string }
                price:            { type: number }
                duration_minutes: { type: integer, default: 30 }
      responses:
        "201":
          description: Service added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HospitalServiceResponse" }

  /api/hospitals/{hospital_id}/slots:
    parameters:
      - name: hospital_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Hospitals]
      summary: Get available appointment slots
      security: []
      parameters:
        - name: vet_id
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SlotResponse" }
    post:
      tags: [Hospitals]
      summary: Create appointment slot (vet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vet_id, slot_date, start_time, end_time]
              properties:
                vet_id:       { type: string, format: uuid }
                slot_date:    { type: string, format: date }
                start_time:   { type: string, format: time }
                end_time:     { type: string, format: time }
                is_recurring: { type: boolean, default: false }
      responses:
        "201":
          description: Slot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlotResponse" }

  # ── Appointments ────────────────────────────
  /api/appointments:
    get:
      tags: [Appointments]
      summary: List my appointments
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentResponse" }
    post:
      tags: [Appointments]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hospital_id, vet_id, service_id, slot_id, cat_id]
              properties:
                hospital_id: { type: string, format: uuid }
                vet_id:      { type: string, format: uuid }
                service_id:  { type: string, format: uuid }
                slot_id:     { type: string, format: uuid }
                cat_id:      { type: string, format: uuid }
                notes:       { type: string }
      responses:
        "201":
          description: Appointment booked, pending payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment_id:  { type: string, format: uuid }
                  hospital_name:   { type: string }
                  service_name:    { type: string }
                  vet_name:        { type: string }
                  cat_name:        { type: string }
                  appointment_date:{ type: string, format: date-time }
                  amount:          { type: number }
                  client_secret:   { type: string, description: "Stripe PaymentIntent client_secret" }
        "409":
          description: Slot already booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/appointments/{appointment_id}/confirm:
    parameters:
      - name: appointment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Appointments]
      summary: Confirm appointment after payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id]
              properties:
                payment_id: { type: string }
      responses:
        "200":
          description: Appointment confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentResponse" }

  # ── Chat ─────────────────────────────────────
  /api/chats:
    get:
      tags: [Chat]
      summary: List my chat rooms
      responses:
        "200":
          description: Chat rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatRoomResponse" }
    post:
      tags: [Chat]
      summary: Start or get a chat room with a vet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vet_id]
              properties:
                vet_id: { type: string, format: uuid }
      responses:
        "200":
          description: Chat room (existing or newly created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatRoomResponse" }

  /api/chats/{room_id}/messages:
    parameters:
      - name: room_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Chat]
      summary: Get messages in a chat room
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageResponse" }
    post:
      tags: [Chat]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:      { type: string, maxLength: 5000 }
                message_type: { $ref: "#/components/schemas/MessageType" }
                media_url:    { type: string }
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  # ── Orders ──────────────────────────────────
  /api/orders:
    get:
      tags: [Orders]
      summary: List my orders
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderResponse" }
    post:
      tags: [Orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, items, delivery_address]
              properties:
                store_id:           { type: string, format: uuid }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity:   { type: integer, minimum: 1 }
                delivery_address:   { type: string }
                delivery_latitude:  { type: number }
                delivery_longitude: { type: number }
                notes:              { type: string }
      responses:
        "201":
          description: Order placed, pending payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:     { type: string, format: uuid }
                  total:        { type: number }
                  client_secret:{ type: string }

  /api/orders/{order_id}/confirm:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Orders]
      summary: Confirm order after payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id]
              properties:
                payment_id: { type: string }
      responses:
        "200":
          description: Order confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }

  # ── Reviews ─────────────────────────────────
  /api/reviews:
    post:
      tags: [Reviews]
      summary: Create a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                hospital_id:     { type: string, format: uuid }
                store_id:        { type: string, format: uuid }
                vet_id:          { type: string, format: uuid }
                rating:          { type: integer, minimum: 1, maximum: 5 }
                comment:         { type: string }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResponse" }

  /api/reviews/{review_id}/respond:
    parameters:
      - name: review_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Reviews]
      summary: Respond to a review (hospital_admin / store_owner / vet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_text]
              properties:
                response_text: { type: string }
      responses:
        "201":
          description: Response posted
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Notifications ────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get my notifications
      parameters:
        - name: is_read
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationResponse" }

  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked as read

  # ── Admin ────────────────────────────────────
  /api/admin/hospitals/{hospital_id}/approve:
    parameters:
      - name: hospital_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      summary: Approve a hospital (admin only)
      responses:
        "200":
          description: Hospital approved
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/stores/{store_id}/approve:
    parameters:
      - name: store_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      summary: Approve a store (admin only)
      responses:
        "200":
          description: Store approved
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/vets/{vet_id}/verify:
    parameters:
      - name: vet_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      summary: Verify a vet (admin only)
      responses:
        "200":
          description: Vet verified
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/medicines:
    post:
      tags: [Admin]
      summary: Add a medicine to the database (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:                  { type: string }
                generic_name:          { type: string }
                manufacturer:          { type: string }
                ingredients:           { type: array, items: { type: string } }
                dosage_form:           { type: string }
                description:           { type: string }
                usage_instructions:    { type: string }
                contraindications:     { type: array, items: { type: string } }
                allergy_warnings:      { type: array, items: { type: string } }
                breed_warnings:        { type: array, items: { type: string } }
                side_effects:          { type: array, items: { type: string } }
                requires_prescription: { type: boolean }
      responses:
        "201":
          description: Medicine added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicineResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
